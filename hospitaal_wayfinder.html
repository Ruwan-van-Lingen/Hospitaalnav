<!doctype html>
<html lang="af">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hospitaal Navigasie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #12222e;
        --navy-2: #1b3446;
        --paper: #e7eef2;
        --paper-line: #c7d6dd;
        --ink: #12222e;
        --ink-soft: #4c6270;
        --amber: #ffb100;
        --amber-dim: #7a5c10;
        --red: #e14b4b;
        --green: #2e8b57;
        --slate: #7c8b99;
        --violet: #6d5dd3;
        --blue: #1e6fa8;
        --paper-text: #f4f7f6;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--navy);
        color: var(--paper-text);
        font-family: "Inter", sans-serif;
        min-height: 100vh;
      }
      header {
        padding: 22px 28px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      header h1 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.2px;
        margin: 0 0 4px;
      }
      header p {
        margin: 0;
        color: #9fb4bf;
        font-size: 13px;
        font-family: "IBM Plex Mono", monospace;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 0;
        align-items: begin;
      }
      .main-col {
        padding: 20px 24px;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
        margin-bottom: 16px;
        background: var(--navy-2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label {
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: #9fb4bf;
        font-family: "IBM Plex Mono", monospace;
      }
      select,
      input,
      button {
        font-family: "Inter", sans-serif;
        font-size: 13.5px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 10px;
        background: #0e1b24;
        color: var(--paper-text);
      }
      select {
        min-width: 190px;
      }
      .bestemming-soek {
        min-width: 220px;
      }
      button.primary {
        background: var(--amber);
        color: #1b1200;
        font-weight: 600;
        border: none;
        cursor: pointer;
        padding: 9px 18px;
      }
      button.primary:hover {
        filter: brightness(1.08);
      }
      button.ghost {
        background: transparent;
        color: #c7d6dd;
        cursor: pointer;
      }
      button.ghost:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .status {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        color: #9fb4bf;
        margin-bottom: 10px;
        min-height: 16px;
      }
      .status.blocked {
        color: var(--red);
      }
      .status.ok {
        color: var(--amber);
      }

      .tabs {
        display: flex;
        gap: 4px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .tab {
        font-family: "Space Grotesk", sans-serif;
        font-size: 12.5px;
        font-weight: 600;
        padding: 8px 12px;
        border-radius: 7px 7px 0 0;
        background: rgba(255, 255, 255, 0.04);
        color: #9fb4bf;
        cursor: pointer;
        border: 1px solid transparent;
        border-bottom: none;
        position: relative;
      }
      .tab.active {
        background: var(--paper);
        color: var(--ink);
      }
      .tab.on-route::after {
        content: "";
        position: absolute;
        top: 5px;
        right: 6px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--amber);
      }

      .plan-wrap {
        background: var(--paper);
        border-radius: 2px 10px 10px 10px;
        padding: 6px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }
      svg {
        width: 100%;
        height: auto;
        display: block;
        background: var(--paper);
        border-radius: 6px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 12px;
        font-size: 11.5px;
        color: #9fb4bf;
        font-family: "IBM Plex Mono", monospace;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .swatch {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        display: inline-block;
      }

      .side {
        padding: 20px 20px 20px 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .panel {
        background: var(--navy-2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .panel h2 {
        font-family: "Space Grotesk", sans-serif;
        font-size: 13px;
        margin: 0 0 10px;
        color: #c7d6dd;
        letter-spacing: 0.03em;
      }

      /* Huisbakstyle vloer indikator strip — signature element */
      .indicator {
        display: flex;
        flex-direction: column-reverse;
        gap: 2px;
      }
      .ind-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 5px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 11px;
        cursor: pointer;
        color: #7189a3;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid transparent;
      }
      .ind-row .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #33475a;
        flex: none;
      }
      .ind-row.current {
        color: #0e1b24;
        background: var(--paper);
        font-weight: 600;
      }
      .ind-row.current .dot {
        background: var(--ink);
      }
      .ind-row.onroute {
        color: var(--amber);
      }
      .ind-row.onroute .dot {
        background: var(--amber);
        box-shadow: 0 0 6px var(--amber);
      }
      .ind-row.onroute.current {
        background: var(--amber);
        color: #1b1200;
      }
      .ind-row.onroute.current .dot {
        background: #1b1200;
      }

      .route-list {
        list-style: none;
        margin: 0;
        padding: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
      }
      .route-list li {
        padding: 7px 8px;
        border-radius: 5px;
        cursor: pointer;
        color: #c7d6dd;
        display: flex;
        justify-content: space-between;
        gap: 6px;
      }
      .route-list li:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .route-list li .t {
        color: #7189a3;
        flex: none;
      }
      .route-total {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed rgba(255, 255, 255, 0.15);
        display: flex;
        justify-content: space-between;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        color: var(--amber);
        font-weight: 600;
      }
      .empty-note {
        color: #7189a3;
        font-size: 12px;
        font-family: "IBM Plex Mono", monospace;
      }

      @media (max-width: 880px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .side {
          padding: 0 24px 24px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Hospitaal Navigasie</h1>
      <p id="apiStatusLine">
        koppel aan FastAPI /route eindpunt · roetes word deur die backend
        bereken
      </p>
    </header>

    <div class="layout">
      <div class="main-col">
        <div class="controls">
          <div class="field">
            <label>API basis-URL</label>
            <input
              type="text"
              id="apiUrl"
              value="http://localhost:8000"

                min-width: 190px;
                font-family: &quot;IBM Plex Mono&quot;, monospace;
                font-size: 12.5px;
                padding: 8px 10px;
                border-radius: 7px;
                border: 1px solid rgba(255, 255, 255, 0.15);
                background: #0e1b24;
                color: var(--paper-text);
              "
            />
          </div>
          <div class="field">
            <label>Gebruiker tipe</label>
            <select id="gebruikerTipe"></select>
          </div>
          <div class="field">
            <label>Vanaf</label>
            <input class="bestemming-soek" id="beginSoek" placeholder="Soek beginpunte..." autocomplete="off" />
            <select id="beginNode" aria-label="Kies beginpunt"></select>
          </div>
          <div class="field">
            <label>Na</label>
            <input class="bestemming-soek" id="eindSoek" placeholder="Soek bestemmings..." autocomplete="off" />
            <select id="endNode" aria-label="Kies bestemming"></select>
          </div>
          <button class="primary" id="findBtn">Vind Roete</button>
          <button class="ghost" id="clearBtn">Herstel</button>
        </div>

        <div class="status" id="status"></div>

        <div class="tabs" id="tabs"></div>

        <div class="plan-wrap">
          <svg id="plan" viewBox="0 0 780 560"></svg>
        </div>

        <div class="legend" id="legend"></div>
      </div>

      <div class="side">
        <div class="panel">
          <h2>Vloer / Hysbak Aanwyser</h2>
          <div class="indicator" id="indicator"></div>
        </div>
        <div class="panel">

          <div id="routePanel">
            <div class="empty-note">
              Kies "Vanaf" en "Na", dan klik Vind Roete.
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>

      // [van, na, RandTipe, afstand_m, Basis_gewig_s, wag_penalty_s, vloer_verander, bidirectional]
      const randRye = [
        ["MAIN-G-ENT", "MAIN-G-J01", "GANG", 10, 8, 0, 0, 1],

      const toegangToestemmings = {

        PERSONEEL: new Set(["SLEGS_PERSONEEL", "ICU_ONLY"]),

      const gebruikerTipeEtikette = {

        PERSONEEL: "Personeel",
        PASIENT_VERVOER: "Pasiënt Vervoer",

      const NODE_KLEURE = {
        AANSLUITING: "#7C8B99",
        HUISBAK_GROEP: "#D97706",
        TRAPHUIS: "#D97706",
        DEUR: "#7C8B99",

      // Elke vloer kry 'n eie kleur sodat, wanneer alle vloere laag-vir-laag
      // bo-op mekaar getoon word (die oorsigaansig), oorvleuelende lae —
      // bv. hysbakke wat op dieselfde plaaslike koördinate op elke vloer sit —
      // steeds van mekaar onderskei kan word.
      const VLOER_KLEURE = {
        "MAIN-G": "#2E8B57",
        "MAIN-1": "#1E6FA8",

      /* ============================================================
   NODE/VLOER LOOKUPS — gebruik slegs vir tekening van vloer plan 
   Pathfinding kom vanaf die FastAPI / roete eindpunt (graph.astar() 
   wat bediener-kant hardloop), nie van JS nie.
   ============================================================ */
      const nodeById = Object.fromEntries(nodes.map((n) => [n.id, n]));
      const vloerById = Object.fromEntries(vloere.map((f) => [f.id, f]));

      async function fetchRoute(apiBase, beginId, eindeId, gebruikerTipe) {
        const url = `${apiBase.replace(/\/$/, "")}/route?begin=${encodeURIComponent(beginId)}&doel=${encodeURIComponent(eindeId)}&gebruiker_tipe=${encodeURIComponent(gebruikerTipe)}`;
        let resp;
        try {
          resp = await fetch(url);
        } catch (networkErr) {
          return {
            error: "network",
            message: `Kon nie ${apiBase} bereik nie. Loop die API? CORS toegelaat?`,
          };
        }

        let body;
        try {
          body = await resp.json();
        } catch (e) {
          body = null;
        }

        if (!resp.ok) {
          const detail =
            body && body.detail ? body.detail : `HTTP ${resp.status}`;
          return {
            error: resp.status === 403 ? "blocked" : "invalid",
            message: detail,
          };
        }

        return {
          path: body.pad,
          cost: body.geskatte_tyd_sekondes,
          formattedCost: body.geskatte_tyd,
          nodeCount: body.node_telling,
        };
      }

      /* ============================================================
                              UI TOESTANDE
      ============================================================ */
      let huidigeVloer = null; // null = oorsig-modus: alle vloere laag-vir-laag saamgevoeg
      let laasteResultaat = null; // {pad, koste}

      function bestemmingEtiket(item) {
        return `${item.etiket} — ${item.gebou_naam}, ${item.vloer_naam} (${item.node_id})`;
      }

      async function laaiBestemmings(soekterm, selectId, gekoseId = null) {
        const apiBase = document.getElementById("apiUrl").value.trim();
        const url = `${apiBase.replace(/\/$/, "")}/destinations?q=${encodeURIComponent(soekterm)}&limiet=100`;
        try {
          const response = await fetch(url);
          if (!response.ok) return;
          const data = await response.json();
          const lys = document.getElementById(selectId);
          lys.innerHTML = "";
          data.bestemmings.forEach((item) => {
            const opsie = document.createElement("option");
            opsie.value = item.node_id;
            opsie.textContent = bestemmingEtiket(item);
            lys.appendChild(opsie);
          });
          if (gekoseId && [...lys.options].some((opsie) => opsie.value === gekoseId)) {
            lys.value = gekoseId;
          }
        } catch (_) {
          // Die roete-foutboodskap hanteer 'n API wat nie bereikbaar is nie.
        }
      }

      function koppelBestemmingSoektog(inputId, selectId) {
        const invoer = document.getElementById(inputId);
        let timer;
        invoer.addEventListener("input", () => {
          clearTimeout(timer);
          timer = setTimeout(() => laaiBestemmings(invoer.value, selectId), 200);
        });
      }

      function bestemmingId(inputId) {
        return document.getElementById(inputId).value || null;
      }

      function populateSelects() {
        const utSel = document.getElementById("gebruikerTipe");
        Object.keys(gebruikerTipeEtikette).forEach((k) => {
          const o = document.createElement("option");
          o.value = k;
          o.textContent = gebruikerTipeEtikette[k];
          utSel.appendChild(o);
        });

        koppelBestemmingSoektog("beginSoek", "beginNode");
        koppelBestemmingSoektog("eindSoek", "endNode");
        laaiBestemmings("", "beginNode", "MAIN-G-ENT");
        laaiBestemmings("", "endNode", "SYGEBOU-1-RAD");
      }

      function renderTabs() {
        const tabsEl = document.getElementById("tabs");
        tabsEl.innerHTML = "";
        const roeterVloere =
          laasteResultaat && laasteResultaat.path
            ? new Set(laasteResultaat.path.map((id) => nodeById[id].vloer))
            : new Set();

        const oorsigTab = document.createElement("div");
        oorsigTab.className = "tab" + (huidigeVloer === null ? " active" : "");
        oorsigTab.textContent = "Oorsig · Alle Vloere";
        oorsigTab.onclick = () => {
          huidigeVloer = null;
          renderAll();
        };
        tabsEl.appendChild(oorsigTab);

        vloere.forEach((f) => {
          const d = document.createElement("div");
          d.className =
            "tab" +
            (f.id === huidigeVloer ? " active" : "") +
            (roeterVloere.has(f.id) ? " on-route" : "");
          d.textContent = `${f.gebou} · ${f.naam}`;
          d.onclick = () => {
            huidigeVloer = f.id;
            renderAll();
          };
          tabsEl.appendChild(d);
        });
      }

      function renderIndicator() {
        const el = document.getElementById("indicator");
        el.innerHTML = "";
        const roeterVloere =
          laasteResultaat && laasteResultaat.path
            ? new Set(laasteResultaat.path.map((id) => nodeById[id].vloer))
            : new Set();

        const oorsigRow = document.createElement("div");
        oorsigRow.className = "ind-row" + (huidigeVloer === null ? " current" : "");
        oorsigRow.innerHTML = `<span class="dot"></span><span>Oorsig — Alle Vloere</span>`;
        oorsigRow.onclick = () => {
          huidigeVloer = null;
          renderAll();
        };
        el.appendChild(oorsigRow);

        vloere.forEach((f) => {
          const row = document.createElement("div");
          row.className =
            "ind-row" +
            (f.id === huidigeVloer ? " current" : "") +
            (roeterVloere.has(f.id) ? " onroute" : "");
          row.innerHTML = `<span class="dot"></span><span>${f.gebou} L${f.level} — ${f.naam}</span>`;
          row.onclick = () => {
            huidigeVloer = f.id;
            renderAll();
          };
          el.appendChild(row);
        });
      }

      function renderLegend() {
        const el = document.getElementById("legend");
        el.innerHTML = "";
        Object.entries(NODE_KLEURE).forEach(([tipe, color]) => {
          const s = document.createElement("span");
          s.innerHTML = `<span class="swatch" style="background:${color}"></span>${tipe}`;
          el.appendChild(s);
        });
      }

      // Uitleg konstantes: SCALE spasieer nodes ver genoeg weg van mekaar dat hulle nooit bots nie; PAD_Y reserveer n duidelike band aan die bokant vir die vloer titel so dat dit nooit onder n node etiktt sit nie
      const SCALE = 15;
      const PAD_X = 55;
      const PAD_Y = 90;
      const px = (n) => n.x * SCALE + PAD_X;
      const py = (n) => n.y * SCALE + PAD_Y;

      // Oorsigaansig: elke vloer se gange en nodusse word laag-vir-laag,
      // deurskynend en in sy eie vloerkleur, bo-op mekaar op dieselfde
      // plaaslike koördinate geteken — sodat albei geboue en alle vloere
      // as een saamgevoegde plan sigbaar is voordat 'n roete gekies is.
      function renderOorsigPlan() {
        const svg = document.getElementById("plan");
        const NS = "http://www.w3.org/2000/svg";
        svg.innerHTML = "";

        randRye.forEach(([van, na, tipe]) => {
          // Vertikale skakels (hysbak/trappe) verbind presies dieselfde
          // plaaslike koördinaat op opeenvolgende vloere — as 'n lyn help
          // dit nie in die oorsig nie, die oorvleuelende nodes toon dit reeds.
          if (tipe === "HUISBAK" || tipe === "TRAPPE") return;
          const a = nodeById[van],
            b = nodeById[na];
          const kleur = VLOER_KLEURE[a.vloer] || VLOER_KLEURE[b.vloer] || "#7C8B99";
          const line = document.createElementNS(NS, "line");
          line.setAttribute("x1", px(a));
          line.setAttribute("y1", py(a));
          line.setAttribute("x2", px(b));
          line.setAttribute("y2", py(b));
          line.setAttribute("stroke", kleur);
          line.setAttribute("stroke-width", 2);
          line.setAttribute("opacity", "0.5");
          svg.appendChild(line);
        });

        nodes.forEach((n) => {
          const cx = px(n),
            cy = py(n);
          const kleur = VLOER_KLEURE[n.vloer] || "#7C8B99";
          const g = document.createElementNS(NS, "g");

          const circle = document.createElementNS(NS, "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);
          circle.setAttribute("r", 6);
          circle.setAttribute("fill", kleur);
          circle.setAttribute("fill-opacity", "0.75");
          circle.setAttribute("stroke", "#fff");
          circle.setAttribute("stroke-width", "1");
          g.appendChild(circle);

          const title = document.createElementNS(NS, "title");
          title.textContent = `${n.etiket} — ${vloerById[n.vloer].gebou} · ${vloerById[n.vloer].naam}`;
          g.appendChild(title);

          g.style.cursor = "pointer";
          g.onclick = () => {
            huidigeVloer = n.vloer;
            renderAll();
          };

          svg.appendChild(g);
        });

        const heading = document.createElementNS(NS, "text");
        heading.setAttribute("x", 20);
        heading.setAttribute("y", 28);
        heading.setAttribute("font-size", "15");
        heading.setAttribute("font-weight", "700");
        heading.setAttribute("font-family", "Space Grotesk, sans-serif");
        heading.setAttribute("fill", "#12222E");
        heading.textContent = "Volledige Hospitaal — Alle Vloere Saamgevoeg";
        svg.appendChild(heading);

        const subheading = document.createElementNS(NS, "text");
        subheading.setAttribute("x", 20);
        subheading.setAttribute("y", 45);
        subheading.setAttribute("font-size", "10.5");
        subheading.setAttribute("font-family", "IBM Plex Mono, monospace");
        subheading.setAttribute("fill", "#4C6270");
        subheading.textContent = "Klik 'n oortjie of 'n nodus om 'n vloer te ondersoek";
        svg.appendChild(subheading);

        // Vloerkleur-legende
        const legendX = 600,
          legendYStart = 470;
        vloere.forEach((f, i) => {
          const ly = legendYStart + i * 16;
          const sq = document.createElementNS(NS, "rect");
          sq.setAttribute("x", legendX);
          sq.setAttribute("y", ly);
          sq.setAttribute("width", 10);
          sq.setAttribute("height", 10);
          sq.setAttribute("rx", 2);
          sq.setAttribute("fill", VLOER_KLEURE[f.id] || "#7C8B99");
          svg.appendChild(sq);

          const txt = document.createElementNS(NS, "text");
          txt.setAttribute("x", legendX + 16);
          txt.setAttribute("y", ly + 9);
          txt.setAttribute("font-size", "9.5");
          txt.setAttribute("font-family", "IBM Plex Mono, monospace");
          txt.setAttribute("fill", "#12222E");
          txt.textContent = `${f.gebou} · ${f.naam}`;
          svg.appendChild(txt);
        });
      }

      function renderPlan() {
        if (huidigeVloer === null) {
          renderOorsigPlan();
          return;
        }
        const svg = document.getElementById("plan");
        const NS = "http://www.w3.org/2000/svg";
        svg.innerHTML = "";

        const vloerNodes = nodes.filter((n) => n.vloer === huidigeVloer);
        const highlightSet = new Set(
          laasteResultaat && laasteResultaat.path ? laasteResultaat.path : [],
        );
        const verligRande = new Set();
        if (laasteResultaat && laasteResultaat.path) {
          const p = laasteResultaat.path;
          for (let i = 0; i < p.length - 1; i++) {
            verligRande.add(p[i] + "|" + p[i + 1]);
            verligRande.add(p[i + 1] + "|" + p[i]);
          }
        }

        // teken selfde-vloer rande 
        randRye.forEach(([van, na, tipe]) => {
          if (
            nodeById[van].vloer === huidigeVloer &&
            nodeById[na].vloer === huidigeVloer
          ) {
            const a = nodeById[van],
              b = nodeById[na];
            const isHl = verligRande.has(van + "|" + na);
            const line = document.createElementNS(NS, "line");
            line.setAttribute("x1", px(a));
            line.setAttribute("y1", py(a));
            line.setAttribute("x2", px(b));
            line.setAttribute("y2", py(b));
            line.setAttribute(
              "stroke",
              isHl ? "#FFB100" : RAND_KLEURE[tipe] || "#ccc",
            );
            line.setAttribute("stroke-width", isHl ? 5 : 2.2);
            if (isHl) {
              line.setAttribute("stroke-linecap", "round");
            }
            svg.appendChild(line);
          }
        });

        // teken nodes - etikette is gesentreer direk onder (of alternating above ), elke node met n soliede halo sodat hulle leesbaar bly en nie bots in aaneengrensende etikette of gang lyne in nie.
        vloerNodes.forEach((n, i) => {
          const cx = px(n),
            cy = py(n);
          const isHl = highlightSet.has(n.id);
          const g = document.createElementNS(NS, "g");
          g.style.cursor = "pointer";
          g.onclick = () => {
            const beginSel = document.getElementById("beginNode"),
              endSel = document.getElementById("endNode");
            if (!g.dataset.pickedOnce) {
              beginSel.value = n.id;
              g.dataset.pickedOnce = "1";
            } else {
              endSel.value = n.id;
            }
          };

          if (n.beperkte) {
            const ring = document.createElementNS(NS, "circle");
            ring.setAttribute("cx", cx);
            ring.setAttribute("cy", cy);
            ring.setAttribute("r", isHl ? 15 : 11);
            ring.setAttribute("fill", "none");
            ring.setAttribute(
              "stroke",
              n.beperkte === "ICU_ONLY" ? "#E14B4B" : "#6D5DD3",
            );
            ring.setAttribute("stroke-width", 1.6);
            ring.setAttribute("stroke-dasharray", "3,3");
            svg.appendChild(ring);
          }

          const circle = document.createElementNS(NS, "circle");
          circle.setAttribute("cx", cx);
          circle.setAttribute("cy", cy);
          circle.setAttribute("r", isHl ? 9 : 6.5);
          circle.setAttribute("fill", NODE_KLEURE[n.tipe] || "#333");
          circle.setAttribute("stroke", isHl ? "#FFB100" : "#fff");
          circle.setAttribute("stroke-width", isHl ? 2.4 : 1.2);
          g.appendChild(circle);

          // alternate bo/onder per node sodat die twee naby-gespasieerde nodes op dies ry nie hulle etikette bo op mekaar stack nie 
          const below = i % 2 === 0;
          const ty = below ? cy + 18 : cy - 12;

          const text = document.createElementNS(NS, "text");
          text.setAttribute("x", cx);
          text.setAttribute("y", ty);
          text.setAttribute("text-anchor", "middle");
          text.setAttribute("font-size", "9");
          text.setAttribute("font-family", "Inter, sans-serif");
          text.setAttribute("fill", "#12222E");
          text.setAttribute("paint-order", "stroke");
          text.setAttribute("stroke", "#E7EEF2");
          text.setAttribute("stroke-width", "3");
          text.textContent =
            n.etiket + (n.beperkte ? ` [${n.beperkte}]` : "");
          g.appendChild(text);

          svg.appendChild(g);
        });

        const title = document.createElementNS(NS, "text");
        const f = vloerById[huidigeVloer];
        title.setAttribute("x", 20);
        title.setAttribute("y", 28);
        title.setAttribute("font-size", "15");
        title.setAttribute("font-weight", "700");
        title.setAttribute("font-family", "Space Grotesk, sans-serif");
        title.setAttribute("fill", "#12222E");
        title.textContent = `${f.gebou} — ${f.naam}`;
        svg.appendChild(title);
      }

      function renderRoutePanel() {
        const el = document.getElementById("routePanel");
        el.innerHTML = "";
        if (!laasteResultaat) {
          el.innerHTML =
            '<div class="empty-note">Kies "Vanaf" en "Na", dan klik Vind Roete.</div>';
          return;
        }
        if (laasteResultaat.error) {
          el.innerHTML = `<div class="empty-note">${laasteResultaat.message}</div>`;
          return;
        }
        if (!laasteResultaat.path) {
          el.innerHTML = '<div class="empty-note">Geen roete gevind nie.</div>';
          return;
        }
        const ul = document.createElement("ul");
        ul.className = "route-list";
        laasteResultaat.path.forEach((id, i) => {
          const n = nodeById[id];
          const li = document.createElement("li");
          li.innerHTML = `<span>${i + 1}. ${n.etiket}</span><span class="t">${vloerById[n.vloer].gebou} L${vloerById[n.vloer].level}</span>`;
          li.onclick = () => {
            huidigeVloer = n.vloer;
            renderAll();
          };
          ul.appendChild(li);
        });
        el.appendChild(ul);
        const total = document.createElement("div");
        total.className = "route-total";
        total.innerHTML = `<span>Totale tyd</span><span>${laasteResultaat.formattedCost}</span>`;
        el.appendChild(total);
      }

      function renderStatus() {
        const el = document.getElementById("status");
        if (!laasteResultaat) {
          el.textContent = "";
          el.className = "status";
          return;
        }
        if (laasteResultaat.error === "blocked") {
          el.textContent = `⛔ Toegang geweier (403): ${laasteResultaat.message}`;
          el.className = "status blocked";
        } else if (laasteResultaat.error === "invalid") {
          el.textContent = `⚠ Ongeldige versoek: ${laasteResultaat.message}`;
          el.className = "status blocked";
        } else if (laasteResultaat.error === "network") {
          el.textContent = `⚠ ${laasteResultaat.message}`;
          el.className = "status blocked";
        } else if (!laasteResultaat.path) {
          el.textContent = "⛔ Geen roete beskikbaar nie.";
          el.className = "status blocked";
        } else {
          el.textContent = `✓ Roete gevind via API: ${laasteResultaat.nodeCount} node(s), ${laasteResultaat.formattedCost}.`;
          el.className = "status ok";
        }
      }

      function renderAll() {
        renderTabs();
        renderIndicator();
        renderPlan();
        renderRoutePanel();
        renderStatus();
      }

      document.getElementById("findBtn").onclick = async () => {
        const begin = bestemmingId("beginNode");
        const end = bestemmingId("endNode");
        const ut = document.getElementById("gebruikerTipe").value;
        const apiBase = document.getElementById("apiUrl").value.trim();

        if (!begin || !end) {
          laasteResultaat = {
            error: "invalid",
            message: "Kies asseblief 'n geldige beginpunt en bestemming uit die soeklys.",
          };
          renderAll();
          return;
        }

        const btn = document.getElementById("findBtn");
        btn.disabled = true;
        btn.textContent = "Soek...";
        document.getElementById("status").textContent = "⏳ Roep API aan...";
        document.getElementById("status").className = "status";

        laasteResultaat = await fetchRoute(apiBase, begin, end, ut);

        btn.disabled = false;
        btn.textContent = "Vind Roete";
        if (laasteResultaat.path) huidigeVloer = nodeById[begin].vloer;
        renderAll();
      };
      document.getElementById("clearBtn").onclick = () => {
        laasteResultaat = null;
        huidigeVloer = null;
        renderAll();
      };

      populateSelects();
      renderLegend();
      renderAll();
    </script>
  </body>
</html>
