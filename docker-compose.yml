# Begin met: docker compose up --build -d
# Webkoppelvlak: http://localhost:8000/ui
# Administrasie: http://localhost:8000/admin
services:
  hospitaalnav:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospitaalnav:latest
    container_name: hospitaalnav
    ports:
      - "8000:8000"
    environment:
      # Bewaar die databasis wanneer die houer herbegin of herskep word.
      AUTO_HERBOU_DB: "false"
      DB_PAD: "/app/data/hospitaal.db"
      # Stel eie waardes via die omgewing of 'n plaaslike .env-lêer.
      # Die terugvalwaardes is slegs vir plaaslike demonstrasies.
      ADMIN_GEBRUIKERSNAAM: "${ADMIN_GEBRUIKERSNAAM:-admin}"
      ADMIN_WAGWOORD: "${ADMIN_WAGWOORD:-heuningbye123!}"
      SESSIE_GEHEIM: "${SESSIE_GEHEIM:-verander-hierdie-ontwikkelingsgeheim}"
    volumes:
      - hospitaaldata:/app/data
    restart: unless-stopped

volumes:
  hospitaaldata:
