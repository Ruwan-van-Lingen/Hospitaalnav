services:
  hospitaalnav:
    build:
      context: .
      dockerfile: Dockerfile
    image: hospitaalnav:latest
    container_name: hospitaalnav
    ports:
      - "8000:8000"
    environment:
      AUTO_HERBOU_DB: "false"
      ADMIN_GEBRUIKERSNAAM: "admin"
      ADMIN_WAGWOORD: "verander-my"
      SESSIE_GEHEIM: "vervang-met-n-lang-willekeurige-geheim"
    restart: unless-stopped

  # docker compose up --build -d (indien 1ste keer of requirments.txt het verander)
  # docker compose up --build (vir normale gebruik)
  # docker compose down (om af te sit)

  # http://localhost:8000/ui (ons pretty version)
  # http://localhost:8000/docs (default API version)
  # http://localhost:8000/admin (admin login)
  # Admin login: User: admin PW: verander-my (kan verander word in .env file)